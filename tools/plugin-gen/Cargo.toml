[package]
name = "plugin-gen"
version = "0.1.0"
edition = "2024"
description = "Generate proto TOML plugin values from GitHub releases API"

[dependencies]
reqwest = { version = "=0.12.15", features = ["json", "blocking"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
clap = { version = "=4.5.39", features = ["derive"] }
