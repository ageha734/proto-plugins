# yaml-language-server: $schema=https://moonrepo.dev/schemas/tasks.json
taskOptions:
  cache: false
  cacheLifetime: 3 hr
  shell: true
  unixShell: bash
  windowsShell: bash
  affectedFiles: true
tasks:
  fmt:
    inputs:
      - "**/*.go"
    command:
      - dprint
      - fmt
      - --config $workspaceRoot/.dprint.json
      - "**/*.go"
  lint:
    inputs:
      - "**/*.go"
    command:
      - dprint
      - check
      - --config $workspaceRoot/.dprint.json
      - "**/*.go"
  test:
    inputs:
      - "**/*.go"
    command:
      - go
      - test
      - -overlay=$(go run github.com/tenntenn/testtime/cmd/testtime@v0.3.2)
  ci:
    deps:
      - fmt
      - lint
      - test
    options:
      runDepsInParallel: false
      affectedFiles: false
      cache: false
inheritedBy:
  toolchain: go
