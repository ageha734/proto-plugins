name = "terraformer"
type = "cli"

[platform.linux]
download-file = "terraformer-all-linux-{arch}"
bin-path = "terraformer"

[platform.macos]
download-file = "terraformer-all-darwin-{arch}"
bin-path = "terraformer"

[install]
download-url = "https://github.com/GoogleCloudPlatform/terraformer/releases/download/{version}/{download_file}"
unpack = false

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[resolve]
git-url = "https://github.com/GoogleCloudPlatform/terraformer"
