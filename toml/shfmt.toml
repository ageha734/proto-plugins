name = "shfmt"
type = "cli"

[platform.linux]
download-file = "shfmt_v{version}_linux_{arch}"
bin-path = "shfmt"

[platform.macos]
download-file = "shfmt_v{version}_darwin_{arch}"
bin-path = "shfmt"

[platform.windows]
download-file = "shfmt_v{version}_windows_{arch}.exe"
bin-path = "shfmt.exe"

[install]
download-url = "https://github.com/mvdan/sh/releases/download/v{version}/{download_file}"
unpack = false

[install.arch]
x86 = "386"
x86_64 = "amd64"
aarch64 = "arm64"

[resolve]
manifest-url = "https://api.github.com/repos/mvdan/sh/releases?per_page=100"
manifest-version-key = "tag_name"
version-pattern = "^v?(\\d+\\.\\d+\\.\\d+)$"
