$schema: https://moonrepo.dev/schemas/project.json
id: workspace
project:
  description: Proto Tools
tasks:
  fmt:
    command:
      - dprint
      - fmt
      - --config
      - $workspaceRoot/.dprint.json
    options:
      shell: true
      cache: false
  lint:
    command:
      - dprint
      - check
      - --config
      - $workspaceRoot/.dprint.json
    options:
      shell: true
      cache: false
  ci:
    deps:
      - fmt
      - lint
    options:
      runDepsInParallel: false
      cache: false
