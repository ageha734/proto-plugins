$schema: https://moonrepo.dev/schemas/project.json
id: workspace
project:
    description: Proto Tools
    title: proto-tools
tasks:
    fmt:
        extends: _lintFormatBase
        command:
        - dprint
        - fmt
        - --config $workspaceRoot/.dprint.json
        options:
            affectedFiles: false
    lint:
        extends: _lintFormatBase
        command:
        - dprint
        - check
        - --config $workspaceRoot/.dprint.json
        options:
            affectedFiles: false
    ci:
        deps:
        - lint
        options:
            runDepsInParallel: false
            affectedFiles: false
            cache: false
            internal: false
