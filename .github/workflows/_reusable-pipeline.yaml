name: "[Reusable] Pipeline"

on:
  workflow_call:
    inputs:
      command:
        type: string
        default: "moon ci"
      report:
        type: boolean
        default: true

jobs:
  ci:
    name: "${{ matrix.config.target }}"
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-26
            target: aarch64-apple-darwin
            experimental: false
            install-continue-on-error: false

          - os: windows-2025
            target: x86_64-pc-windows-msvc
            experimental: false
            install-continue-on-error: true

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            experimental: true
            install-continue-on-error: true

          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            experimental: true
            install-continue-on-error: true

          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            experimental: true
            install-continue-on-error: true

    env:
      TARGET: ${{ matrix.config.target }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          cache: false
          auto-install: false

      - name: Install tools
        continue-on-error: ${{ matrix.config.install-continue-on-error }}
        env:
          PROTO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: proto install

      - name: Run  ${{ inputs.command }}
        run: ${{ inputs.command }}

      - if: (success() || failure()) && inputs.report
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Generate report
        if: (success() || failure()) && inputs.report
        run: deno run --allow-read ./.github/scripts/report/main.ts
